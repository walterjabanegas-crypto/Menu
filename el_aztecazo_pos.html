<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EL AZTECAZO POS</title>
<style>
:root{color-scheme:dark;--bg:#151515;--panel:#202020;--panel2:#292929;--line:#3a3a3a;--text:#f5f5f5;--muted:#aaa;--yellow:#f4c542;--green:#27ae60;--blue:#2980b9;--red:#d94b4b;--purple:#8e44ad}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;background:var(--bg)}
header{height:70px;background:#101010;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:var(--yellow);color:#111;display:grid;place-items:center;font-weight:900;font-size:20px}.brand h1{font-size:20px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.clock{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:1fr 370px;gap:14px;max-width:1400px;margin:auto;padding:14px}.main{min-width:0}.topbar{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.tab{background:var(--panel);color:#ddd;padding:10px 14px;border-radius:10px;white-space:nowrap}.tab.active{background:var(--yellow);color:#111;font-weight:800}.view{display:none}.view.active{display:block}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px}.category{background:var(--panel);color:#ddd;border:1px solid var(--line);padding:10px 13px;border-radius:10px}.category.active{background:#3a3014;border-color:var(--yellow);color:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.product{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;min-height:125px;transition:.15s}.product:hover{border-color:#666;transform:translateY(-1px)}.product .emoji{font-size:28px}.product b{display:block;margin:8px 0 5px}.product span{color:var(--green);font-weight:800}.product small{display:block;color:var(--muted);margin-top:5px}.empty{padding:35px;text-align:center;color:var(--muted);background:var(--panel);border-radius:14px}
.cart{background:var(--panel);border:1px solid var(--line);border-radius:16px;position:sticky;top:84px;height:calc(100vh - 98px);display:flex;flex-direction:column;overflow:hidden}.carthead{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.carthead h2{font-size:17px;margin:0}.count{background:#3a3a3a;border-radius:999px;padding:4px 8px;color:#ddd;font-size:12px}.cartitems{flex:1;overflow:auto;padding:10px}.cartitem{padding:10px 0;border-bottom:1px solid var(--line)}.cartrow{display:flex;justify-content:space-between;gap:8px}.cartitem b{font-size:13px}.cartitem .price{color:var(--green);font-weight:800}.qty{display:flex;align-items:center;gap:6px;margin-top:8px}.qty button{width:28px;height:28px;border-radius:8px;background:#3a3a3a;color:#fff}.qty span{min-width:24px;text-align:center}.remove{margin-left:auto;color:#ff8d8d;background:none}.summary{border-top:1px solid var(--line);padding:14px}.line{display:flex;justify-content:space-between;margin:7px 0;color:#ccc}.grand{font-size:22px;font-weight:900;color:var(--yellow);margin:10px 0}.input{width:100%;background:#121212;border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.btn{padding:11px;border-radius:10px;font-weight:800}.primary{background:var(--green);color:white}.secondary{background:var(--blue);color:white}.danger{background:var(--red);color:white}.dark{background:#3a3a3a;color:white}.purple{background:var(--purple);color:white}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.card small{color:var(--muted)}.card strong{display:block;font-size:24px;margin-top:8px}.section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:12px}.section h2{margin:0 0 12px;font-size:17px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.table th{color:var(--yellow);font-size:12px}.adminform{display:grid;grid-template-columns:1.3fr .7fr .7fr auto;gap:8px}.select,.input{min-height:42px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#333;color:#ddd;font-size:11px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show{display:flex}.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(520px,100%);padding:18px}.modalbox h2{margin-top:0}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.receipt{background:#fff;color:#111;padding:18px;max-width:380px;margin:auto;font-family:monospace}.receipt h2{text-align:center;margin:0}.receipt hr{border:0;border-top:1px dashed #555}.receipt .rline{display:flex;justify-content:space-between}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;border:1px solid #555;padding:11px 16px;border-radius:10px;display:none;z-index:100}.toast.show{display:block}
@media(max-width:900px){.layout{grid-template-columns:1fr}.cart{position:relative;top:auto;height:auto;max-height:75vh}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){header{padding:0 12px}.brand h1{font-size:17px}.clock{display:none}.layout{padding:10px}.grid{grid-template-columns:repeat(2,1fr)}.product{min-height:115px;padding:11px}.adminform{grid-template-columns:1fr 1fr}.adminform button{grid-column:1/-1}.pay{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff}.app>header,.layout{display:none}.modal{display:flex;position:static;background:#fff}.modalbox{border:0;width:100%}.modalbox>*:not(.receipt){display:none!important}.receipt{display:block!important}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">AZ</div><div><h1>EL AZTECAZO</h1><small>Punto de venta</small></div></div><div class="clock" id="clock"></div></header>
<div class="layout">
<main class="main">
<div class="topbar"><button class="tab active" data-view="pos">🧾 Caja</button><button class="tab" data-view="dashboard">📊 Resumen</button><button class="tab" data-view="menu">🍴 Menú</button><button class="tab" data-view="history">🕘 Ventas</button></div>
<section id="pos" class="view active">
<div class="toolbar"><input class="search" id="search" placeholder="Buscar producto..."><div id="cats"></div></div>
<div class="grid" id="products"></div>
</section>
<section id="dashboard" class="view"><div class="cards" id="cards"></div><div class="section"><h2>Ventas recientes</h2><div class="tablewrap"><table class="table"><thead><tr><th>Hora</th><th>Productos</th><th>Total</th><th>Pago</th></tr></thead><tbody id="recent"></tbody></table></div></div></section>
<section id="menu" class="view"><div class="section"><h2>Administrar menú</h2><div class="adminform"><input class="input" id="pname" placeholder="Nombre"><input class="input" id="pprice" type="number" step="0.01" placeholder="Precio"><select class="input" id="pcat"></select><button class="btn primary" id="addp">Agregar</button></div></div><div class="section"><div class="tablewrap"><table class="table"><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Acción</th></tr></thead><tbody id="menutable"></tbody></table></div></div></section>
<section id="history" class="view"><div class="section"><h2>Historial de ventas</h2><div class="toolbar"><input class="search" id="histSearch" placeholder="Buscar por número o producto"><button class="btn danger" id="clearHistory">Borrar historial</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Venta</th><th>Fecha</th><th>Productos</th><th>Total</th><th>Acción</th></tr></thead><tbody id="historytable"></tbody></table></div></div></section>
</main>
<aside class="cart"><div class="carthead"><h2>Venta actual</h2><span class="count" id="cartcount">0 productos</span></div><div class="cartitems" id="cart"></div><div class="summary"><div class="line"><span>Subtotal</span><span id="subtotal">L 0.00</span></div><div class="line"><span>Descuento</span><span>L 0.00</span></div><div class="grand" id="total">L 0.00</div><input class="input" id="received" type="number" step="0.01" placeholder="Dinero recibido"><div class="pay"><button class="btn primary" id="charge">COBRAR</button><button class="btn dark" id="newSale">NUEVA</button></div></div></aside>
</div></div>
<div class="modal" id="modal"><div class="modalbox"><div id="receipt"></div><div class="modal-actions"><button class="btn dark" id="closeModal">Cerrar</button><button class="btn secondary" id="print">🖨️ Imprimir</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const seed=[
['Carne Asada',150,'Asados'],['Asado de Pollo',150,'Asados'],['Chuleta Asada',150,'Asados'],['Chorizo Asado',150,'Asados'],['Parrillada Personal',200,'Parrilladas'],['Parrillada para 2',400,'Parrilladas'],['Parrillada Familiar',700,'Parrilladas'],['Taco de Res',150,'Tacos'],['Taco al Pastor',140,'Tacos'],['Taco de Pollo',140,'Tacos'],['Gringa de Res',140,'Gringas'],['Gringa de Cerdo',140,'Gringas'],['Gringa de Pollo',140,'Gringas'],['Alambre de Res',150,'Alambres'],['Alambre de Pollo',150,'Alambres'],['Nachos',140,'Entradas']
];
const KEY='az_products_v1', SALES='az_sales_v1';
let products=JSON.parse(localStorage.getItem(KEY)||'null')||seed.map((x,i)=>({id:i+1,name:x[0],price:x[1],cat:x[2]}));
let sales=JSON.parse(localStorage.getItem(SALES)||'[]'); let cart=[]; let activeCat='Todos';
const $=id=>document.getElementById(id), money=n=>'L '+Number(n).toFixed(2), save=()=>localStorage.setItem(KEY,JSON.stringify(products)), saveSales=()=>localStorage.setItem(SALES,JSON.stringify(sales));
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function renderCats(){let cats=['Todos',...new Set(products.map(p=>p.cat))];$('cats').innerHTML=cats.map(c=>`<button class="category ${c===activeCat?'active':''}" onclick="setCat('${esc(c)}')">${c}</button>`).join('')}
function setCat(c){activeCat=c;renderCats();renderProducts()}
function renderProducts(){let q=$('search').value.toLowerCase();let list=products.filter(p=>(activeCat==='Todos'||p.cat===activeCat)&&p.name.toLowerCase().includes(q));$('products').innerHTML=list.length?list.map(p=>`<button class="product" onclick="add(${p.id})"><div class="emoji">${icon(p.cat)}</div><b>${esc(p.name)}</b><span>${money(p.price)}</span><small>${esc(p.cat)}</small></button>`).join(''):'<div class="empty">No hay productos que coincidan.</div>'}
function icon(c){return ({Tacos:'🌮',Gringas:'🫓',Asados:'🥩',Parrilladas:'🔥',Alambres:'🍳',Entradas:'🧀',Bebidas:'🥤',Otros:'🍽️'})[c]||'🍽️'}
function add(id){let p=products.find(x=>x.id===id);let it=cart.find(x=>x.id===id);if(it)it.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1});renderCart()}
function renderCart(){let total=0,count=0;$('cart').innerHTML=cart.length?cart.map((x,i)=>{let s=x.price*x.qty;total+=s;count+=x.qty;return `<div class="cartitem"><div class="cartrow"><b>${esc(x.name)}</b><span class="price">${money(s)}</span></div><div class="qty"><button onclick="qty(${i},-1)">−</button><span>${x.qty}</span><button onclick="qty(${i},1)">+</button><button class="remove" onclick="removeItem(${i})">Eliminar</button></div></div>`}).join(''):'<div class="empty">Agrega productos para comenzar.</div>';$('subtotal').textContent=money(total);$('total').textContent=money(total);$('cartcount').textContent=count+' '+(count===1?'producto':'productos')}
function qty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}function removeItem(i){cart.splice(i,1);renderCart()}
function charge(){if(!cart.length)return toast('La venta está vacía');let total=cart.reduce((a,x)=>a+x.price*x.qty,0);let received=parseFloat($('received').value);if(!Number.isFinite(received)||received<total)return toast('Dinero insuficiente o inválido');let sale={id:Date.now(),date:new Date().toISOString(),items:cart.map(x=>({...x})),total,received,change:received-total};sales.unshift(sale);saveSales();showReceipt(sale);cart=[];$('received').value='';renderCart();renderDashboard();renderHistory()}
function newSale(){cart=[];$('received').value='';renderCart();toast('Nueva venta')}
function showReceipt(s){$('receipt').innerHTML=`<div class="receipt"><h2>EL AZTECAZO</h2><div style="text-align:center">Comprobante de venta</div><hr><div>Venta #${s.id}</div><div>${new Date(s.date).toLocaleString('es-HN')}</div><hr>${s.items.map(x=>`<div class="rline"><span>${x.qty}x ${esc(x.name)}</span><span>${money(x.qty*x.price)}</span></div>`).join('')}<hr><div class="rline"><b>TOTAL</b><b>${money(s.total)}</b></div><div class="rline"><span>Recibido</span><span>${money(s.received)}</span></div><div class="rline"><span>Vuelto</span><span>${money(s.change)}</span></div><hr><div style="text-align:center">¡Gracias por su compra!</div></div>`;$('modal').classList.add('show')}
function renderDashboard(){let today=new Date().toDateString();let todays=sales.filter(s=>new Date(s.date).toDateString()===today);let amount=todays.reduce((a,s)=>a+s.total,0);let units=todays.reduce((a,s)=>a+s.items.reduce((b,x)=>b+x.qty,0),0);$('cards').innerHTML=`<div class="card"><small>Ventas hoy</small><strong>${todays.length}</strong></div><div class="card"><small>Ingresos hoy</small><strong>${money(amount)}</strong></div><div class="card"><small>Productos vendidos</small><strong>${units}</strong></div><div class="card"><small>Productos en menú</small><strong>${products.length}</strong></div>`;$('recent').innerHTML=sales.slice(0,8).map(s=>`<tr><td>${new Date(s.date).toLocaleTimeString('es-HN',{hour:'2-digit',minute:'2-digit'})}</td><td>${s.items.reduce((a,x)=>a+x.qty,0)}</td><td>${money(s.total)}</td><td>${money(s.received)}</td></tr>`).join('')||'<tr><td colspan="4">Sin ventas.</td></tr>'}
function renderMenu(){let cats=[...new Set(products.map(p=>p.cat))];$('pcat').innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('');$('menutable').innerHTML=products.map(p=>`<tr><td>${esc(p.name)}</td><td><span class="pill">${esc(p.cat)}</span></td><td>${money(p.price)}</td><td><button class="btn danger" onclick="delProduct(${p.id})">Eliminar</button></td></tr>`).join('')}
function delProduct(id){let p=products.find(x=>x.id===id);if(!confirm('Eliminar '+p.name+' del menú?'))return;products=products.filter(x=>x.id!==id);save();renderAll();toast('Producto eliminado')}
function addProduct(){let name=$('pname').value.trim(),price=parseFloat($('pprice').value),cat=$('pcat').value||'Otros';if(!name||!Number.isFinite(price)||price<=0)return toast('Completa nombre y precio');if(products.some(p=>p.name.toLowerCase()===name.toLowerCase()))return toast('Ese producto ya existe');products.push({id:Date.now(),name,price,cat});save();$('pname').value='';$('pprice').value='';renderAll();toast('Producto agregado')}
function renderHistory(){let q=$('histSearch').value.toLowerCase();let list=sales.filter(s=>String(s.id).includes(q)||s.items.some(x=>x.name.toLowerCase().includes(q)));$('historytable').innerHTML=list.map(s=>`<tr><td>#${s.id}</td><td>${new Date(s.date).toLocaleString('es-HN')}</td><td>${s.items.map(x=>x.qty+'x '+esc(x.name)).join(', ')}</td><td>${money(s.total)}</td><td><button class="btn secondary" onclick="showReceipt(s)">Ver</button></td></tr>`).join('')||'<tr><td colspan="5">No hay ventas.</td></tr>'}
function renderAll(){renderCats();renderProducts();renderMenu();renderDashboard();renderHistory();renderCart()}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function tabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(b.dataset.view).classList.add('active');renderAll()})}
$('search').oninput=renderProducts;$('charge').onclick=charge;$('newSale').onclick=newSale;$('addp').onclick=addProduct;$('histSearch').oninput=renderHistory;$('clearHistory').onclick=()=>{if(confirm('¿Borrar todo el historial?')){sales=[];saveSales();renderDashboard();renderHistory();toast('Historial borrado')}};$('closeModal').onclick=()=>$('modal').classList.remove('show');$('print').onclick=()=>window.print();tabs();setInterval(()=>{$('clock').textContent=new Date().toLocaleString('es-HN',{dateStyle:'short',timeStyle:'short'})},1000);renderAll();
</script>
</body>
</html>
